# server/site/htaccess-racine.conf
#
# LE `.htaccess` DE LA RACINE WEB, EN ENTIER. À déposer renommé `.htaccess` à
# la racine d'axemusique.shop (le répertoire qui contient `index.php`,
# `wp-config.php` et `frontend/`). Ce fichier REMPLACE l'existant : garder une
# copie de l'ancien avant de l'écraser.
#
# Écrit le 16 septembre 2026, à partir du fichier alors en ligne. Deux
# changements sur cette version :
#
#   1. WORDPRESS EST COUPÉ. La migration est terminée : mesuré le même jour sur
#      le bundle réellement en production (`/assets/index-BN-0HNVh.js`), il ne
#      porte plus AUCUN `wp-json`, AUCUN `wp-content`, AUCUNE clé WooCommerce.
#      Le site vit de `/data/menu.json` et de `server/api/catalog.php`.
#      `axe.5sensprod.com` répond donc 403 sur tout — décision du propriétaire.
#      C'est réversible : remettre le bloc WordPress de l'ancien fichier suffit,
#      l'installation n'est pas supprimée du disque. Les moteurs, eux,
#      désindexeront.
#
#   2. DES EN-TÊTES DE CACHE. Jusque-là, ni `/`, ni `/assets/*`, ni
#      `/data/menu.json` ne renvoyaient de `Cache-Control` : Apache ne posait
#      qu'un `ETag` et un `Last-Modified`, et le navigateur appliquait son
#      CACHE HEURISTIQUE — environ 10 % du temps écoulé depuis `Last-Modified`.
#      Un `index.html` déposé cinq jours plus tôt était réutilisé pendant des
#      heures SANS MÊME REVALIDER, laissant le visiteur sur l'ANCIEN bundle
#      entier. C'est ce qui obligeait à faire Ctrl+F5 après une mise en ligne.
#
# ==========================================================
# AXE MUSIQUE
#
# axemusique.shop     -> React /frontend/
# axe.5sensprod.com   -> coupé (403)
# API commune         -> /server/api/
# ==========================================================

RewriteEngine On
RewriteBase /


# ==========================================================
# AXE.5SENSPROD.COM — COUPÉ
# ==========================================================
#
# EN PREMIER, avant toute autre règle : le sous-domaine ne sert plus rien, pas
# même un fichier existant. Retirer seulement les anciennes règles de
# réécriture n'aurait PAS suffi — Apache aurait continué à servir l'`index.php`
# de WordPress par `DirectoryIndex`, et `/wp-admin/` de même.

RewriteCond %{HTTP_HOST} ^(?:www\.)?axe\.5sensprod\.com$ [NC]
RewriteRule ^ - [F,L]


# ==========================================================
# SERVER / API
# ==========================================================

# API PHP : ne passe pas par React
RewriteRule ^server/api(?:/|$) - [L]

# Configuration serveur interdite en HTTP (la protection de ceinture ;
# `server/config/.htaccess` en porte une autre, et les deux sont voulues)
RewriteRule ^server/config(?:/|$) - [F,L]


# ==========================================================
# AXEMUSIQUE.SHOP -> REACT
# ==========================================================

# Racine
RewriteCond %{HTTP_HOST} ^(?:www\.)?axemusique\.shop$ [NC]
RewriteRule ^$ frontend/index.html [L]


# Assets Vite
RewriteCond %{HTTP_HOST} ^(?:www\.)?axemusique\.shop$ [NC]
RewriteRule ^assets/(.*)$ frontend/assets/$1 [L]


# Fichiers publics du build
RewriteCond %{HTTP_HOST} ^(?:www\.)?axemusique\.shop$ [NC]
RewriteRule ^(favicon\.ico|vite\.svg|robots\.txt|manifest\.webmanifest|site\.webmanifest)$ frontend/$1 [L]


# Ancienne route /home
RewriteCond %{HTTP_HOST} ^(?:www\.)?axemusique\.shop$ [NC]
RewriteRule ^home/?$ / [R=301,L]


# Fallback SPA
# /shop
# /produit/...
# /categorie-produit/...
# /bons-plans
# /mentions-legales
# etc.
RewriteCond %{HTTP_HOST} ^(?:www\.)?axemusique\.shop$ [NC]
RewriteCond %{REQUEST_URI} !^/server/ [NC]
RewriteCond %{REQUEST_URI} !^/frontend/ [NC]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^ frontend/index.html [L]


# ==========================================================
# HEADERS
# ==========================================================

<IfModule mod_headers.c>

    Header always set X-Content-Type-Options "nosniff"

    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # --- CACHE ---------------------------------------------------------
    #
    # LE BUNDLE. Vite pose une empreinte dans le nom de chaque fichier
    # (`index-BN-0HNVh.js`) : un nouveau build produit un NOUVEAU NOM, jamais
    # un nouveau contenu sous le même nom. Ces fichiers peuvent donc être
    # gardés sans expiration ET sans revalidation.
    #
    # `<LocationMatch>` serait le geste naturel, mais il est INTERDIT dans un
    # `.htaccess` — contexte serveur et hôte virtuel seulement — et Apache
    # répondrait 500 sur TOUT le site. D'où la variable d'environnement, qui,
    # elle, est autorisée ici. Le motif couvre les deux chemins : l'URL
    # publique `/assets/…` et la cible réelle `/frontend/assets/…`.
    #
    # Pas de `.htaccess` déposé DANS `assets/` non plus : ce dossier est
    # remplacé à chaque déploiement du build, le fichier y disparaîtrait.
    SetEnvIf Request_URI "^/(?:frontend/)?assets/" PA_ASSET_FIGE
    Header set Cache-Control "public, max-age=31536000, immutable" env=PA_ASSET_FIGE

    # L'AIGUILLAGE. `index.html` est le seul fichier qui désigne l'empreinte
    # du jour : il doit être revérifié à CHAQUE visite. `no-cache` ne veut pas
    # dire « ne pas garder en cache » mais « ne pas servir sans revalider » :
    # Apache répond 304 tant que le fichier n'a pas bougé, soit quelques
    # centaines d'octets, et une mise en ligne devient visible immédiatement.
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # LE MENU PUBLIÉ. Réécrit à chaque « Publier le menu » depuis PocketApp
    # (`/data/menu.json`). Même régime : revalidation, pas d'expiration.
    <FilesMatch "^menu\.json$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # ⚠️ NE PAS ÉTENDRE `immutable` AUX IMAGES DU CATALOGUE.
    #
    # Le miroir des images écrit sous un chemin CALCULÉ,
    # `<kind>/<legacy_id>/<rang>.<ext>` : remplacer la photo d'un produit
    # réécrit le MÊME nom de fichier. Contrairement aux fichiers d'`assets/`,
    # le nom ne change donc pas avec le contenu, et les figer un an rendrait
    # tout changement de visuel invisible pour quiconque a déjà vu la page.
    # Elles restent en revalidation par `ETag`, c'est-à-dire sans règle ici.

</IfModule>

# Le `X-Robots-Tag: noindex` de l'ancien fichier visait `axe.5sensprod.com`.
# Il est retiré : un 403 ne s'indexe pas, la règle n'avait plus d'objet.
